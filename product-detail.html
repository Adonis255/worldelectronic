<body>

  <!-- PDP MAIN CONTAINER -->
  <main class="section-padding" style="padding-top: 3rem;">

    <div class="cart-body" id="cartDrawerBody"></div>
    <div class="cart-footer" id="cartDrawerFooter"></div>

  <div class="toast-notification" id="toastNotification" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
